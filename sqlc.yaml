version: "2"
sql:
  - engine: "mysql"
    schema: "db/migrations"
    queries: "db/query"
    gen:
      go:
        package: "db"
        out: "internal/db"
        emit_interface: true
        emit_json_tags: true
        emit_exact_table_names: false
        emit_empty_slices: true

# Optional: untuk MySQL 8 atau MariaDB
plugins: []