version: "2"
sql:
  - engine: "mysql"
    schema: "db/schema"
    queries: "db/query"
    codegen:
      out: "internal/db"   # Output package untuk hasil generate
      package: "db"
      emit_interface: true
      emit_json_tags: true
      emit_exact_table_names: false
      emit_empty_slices: true
      emit_prepared_queries: false

# Optional: untuk MySQL 8 atau MariaDB
plugins: []